name: Publish Quarto Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize GitHub Pages branch
        run: |
          source_branch=$(git branch --show-current)
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git switch --orphan gh-pages
            git -c user.name="GitHub Actions" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit --allow-empty -m "Initialize GitHub Pages branch"
            git push origin gh-pages
            git switch "$source_branch"
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("rmarkdown", "knitr", "tidyverse", "fpp3"))'

      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}